name: Build TWRP14
on:
  workflow_dispatch:

env:
  DEVICE_PATH: device/lenovo/tb375fc
  TWRP_MANIFEST: https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git
  TWRP_BRANCH: twrp-14
  CCACHE_DIR: /home/runner/.ccache
  USE_CCACHE: 1
  CCACHE_COMPRESS: 1
  CCACHE_MAXSIZE: 5G

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout device tree
        uses: actions/checkout@v4
        with:
          path: device_tree

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq git-core gnupg flex bison build-essential zip curl zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 libncurses6 libncurses-dev x11proto-core-dev libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig lz4 libssl-dev python3 python3-pip ccache lld-18

      - name: Install repo tool
        run: |
          mkdir -p ~/bin
          curl -sSL 'https://storage.googleapis.com/git-repo-downloads/repo' > ~/bin/repo
          chmod +x ~/bin/repo
          echo ~/bin >> $GITHUB_PATH

      - name: Configure git
        run: |
          git config --global user.name "Muffin_Joe"
          git config --global user.email "builder@github.com"
          git config --global http.postBuffer 524288000
          git config --global pack.windowMemory "512m"

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: /home/runner/.ccache
          key: ccache-twrp14-${{ github.run_id }}
          restore-keys: ccache-twrp14-

      - name: Init TWRP source
        run: |
          mkdir -p ~/twrp
          cd ~/twrp
          repo init -u $TWRP_MANIFEST -b $TWRP_BRANCH --depth=1

      - name: Remove large prebuilts & add build/release
        run: |
          cd ~/twrp
          # Step 1: Remove large prebuilts from manifest via Python
          python3 << 'PYEOF'
          import xml.etree.ElementTree as ET, os
          mp = '.repo/manifest.xml'
          if os.path.islink(mp): mp = os.path.realpath(mp)
          tree = ET.parse(mp); root = tree.getroot()
          prefixes = [
            'platform/prebuilts/gcc/', 'platform/prebuilts/go/',
            'platform/prebuilts/gradle-plugin', 'platform/prebuilts/jdk/',
            'platform/prebuilts/misc', 'platform/prebuilts/module_sdk/',
            'platform/prebuilts/rust', 'platform/prebuilts/sdk',
            'platform/prebuilts/tools', 'platform/prebuilts/abi-dumps/',
            'platform/prebuilts/clang/host/linux-x86',
            'platform/prebuilts/build-tools',
          ]
          removed = []
          for proj in list(root.findall('project')):
            name = proj.get('name', '')
            if any(name.startswith(p) for p in prefixes):
              root.remove(proj); removed.append(name)
          print(f'Removed {len(removed)} large prebuilt projects')
          tree.write(mp, xml_declaration=True, encoding='UTF-8')
          PYEOF

          # Step 2: Add build/release via local manifest
          mkdir -p .repo/local_manifests
          cat > .repo/local_manifests/build_release.xml << 'XMLEND'
          <?xml version="1.0" encoding="UTF-8"?>
          <manifest>
            <remote name="aosp_fetch" fetch="https://android.googlesource.com" />
            <project path="build/release" name="platform/build/release" remote="aosp_fetch" revision="refs/tags/android-14.0.0_r67" clone-depth="1" />
          </manifest>
          XMLEND
          echo "build_release local manifest added"

      - name: Sync TWRP source
        run: |
          cd ~/twrp
          repo sync --force-sync --no-clone-bundle --no-tags --optimized-fetch --prune -j4 2>&1

      - name: Copy device tree
        run: |
          mkdir -p ~/twrp/$DEVICE_PATH
          cp -r $GITHUB_WORKSPACE/device_tree/* ~/twrp/$DEVICE_PATH/
          rm -rf ~/twrp/$DEVICE_PATH/.github 2>/dev/null || true

      - name: Build TWRP
        run: |
          export CCACHE_DIR=/home/runner/.ccache
          export USE_CCACHE=1
          export CCACHE_COMPRESS=1
          ccache -M 5G
          cd ~/twrp
          source build/envsetup.sh
          lunch twrp_tb375fc-ap2a-eng
          mka vendorbootimage -j2 2>&1

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: twrp-tb375fc-14
          path: |
            ~/twrp/out/target/product/tb375fc/vendor_boot.img
            ~/twrp/out/target/product/tb375fc/recovery.img
          if-no-files-found: warn
